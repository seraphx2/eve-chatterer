[package]
name = "eve-chatterer-app"
version.workspace = true
edition.workspace = true
description = "EVE chat notifier: tray app with in-game overlays"
license = "MIT"

[lib]
name = "eve_chatterer_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
eve-chatterer-core = { path = "../../core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
# The Audio page's Browse button (used from Rust only).
tauri-plugin-dialog = "2"
# Self-update from GitHub Releases (signed), and start at login.
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
# Alert sounds: wav, mp3, ogg and flac.
rodio = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"
# The notification badge image (docs/design/windows-notification.html).
tiny-skia = "0.11"
ab_glyph = "0.2"

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_WinRT",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
tempfile = "3"
