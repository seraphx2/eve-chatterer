name: CI — Rust
description: >
  Clippy (-D warnings) and the whole workspace's tests. Must run on Windows:
  unlike dev-prompt, most of this app (overlays, presence, notifications,
  sound) is Windows-only code that a Linux build would skip. Builds the
  frontend first because `tauri::generate_context!` embeds app/dist. Assumes
  the repo is already checked out.

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: app/package-lock.json

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (a branch: bump by hand)
      with:
        components: clippy

    - name: Cache Rust build
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        cache-on-failure: "true"

    - name: Build frontend bundle (embedded by generate_context!)
      shell: bash
      working-directory: app
      run: npm ci && npx vite build

    - name: Clippy
      shell: bash
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Tests
      shell: bash
      run: cargo test --workspace
