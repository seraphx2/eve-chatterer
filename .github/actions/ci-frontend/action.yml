name: CI — frontend
description: >
  npm ci, then svelte-check + vite build in app/. Runs on Linux in parallel
  with the Rust job; the frontend has nothing platform-specific. Assumes the
  repo is already checked out.

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: app/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: app
      run: npm ci

    - name: Typecheck + build
      shell: bash
      working-directory: app
      run: npm run build
