[workspace]
resolver = "2"
members = ["core", "cli", "tools", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies.windows]
version = "0.61"

# Release builds are for the app; the probes and tests do not care.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
